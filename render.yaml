# Render Blueprint for the API (docs/deploy.md). New → Blueprint → this repository.
# Values marked `sync: false` are asked for when the Blueprint is created (never commit them).
services:
  - type: web
    name: instagram-api
    runtime: node
    region: frankfurt
    plan: free
    # The monorepo root: pnpm installs every workspace, turbo builds @instagram/shared first.
    # "corepack pnpm" runs the pnpm version from package.json without replacing Render's own
    # read-only /usr/bin/pnpm (which "corepack enable" tries to do, and fails on).
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm turbo run build --filter=api
    # Migrations run on every start, so a merged schema change goes live with the code
    startCommand: cd apps/api && ./node_modules/.bin/prisma migrate deploy && node dist/main.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      # corepack downloads pnpm without asking
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: 0
      - key: DATABASE_URL
        sync: false
      - key: WEB_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_SOCKET_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
