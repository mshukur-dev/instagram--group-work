# Local development services. Run: pnpm db:up
services:
  postgres:
    image: postgres:17-alpine
    container_name: instagram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: instagram
      POSTGRES_PASSWORD: instagram
      POSTGRES_DB: instagram
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # LiveKit in dev mode: free, unlimited, keys are devkey / secret
  livekit:
    image: livekit/livekit-server:latest
    container_name: instagram-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  postgres-data:
